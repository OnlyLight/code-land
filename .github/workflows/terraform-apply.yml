name: Terraform Apply

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "infra/**"

permissions:
  contents: read
  id-token: write

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -reconfigure
        working-directory: infra/envs/prod

      - name: Terraform workspace
        run: |
          if terraform workspace list | grep -q " prod"; then
            echo "Workspace prod already exists"
          else
            echo "Creating workspace prod"
            terraform workspace new prod
          fi
          terraform workspace select prod
        working-directory: infra/envs/prod

      - name: Terraform Plan
        run: terraform plan -input=false -out=plan.out
        env:
          TF_VAR_container_image: ${{ vars.CONTAINER_IMAGE_BASE }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        working-directory: infra/envs/prod

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/envs/prod/plan.out

  terraform-apply:
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra/envs/prod

      # Scan Public S3, RDS public access, SG open 0.0.0.0/0, No encryption
      - name: Trivy IaC scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type: config
          scan-ref: infra/envs/prod
          severity: HIGH,CRITICAL

      - name: Terraform Init
        run: terraform init -reconfigure
        working-directory: infra/envs/prod

      - name: Select workspace
        run: terraform workspace select prod
        working-directory: infra/envs/prod

      - name: Terraform Apply
        run: terraform apply -input=false plan.out
        env:
          TF_VAR_container_image: ${{ vars.CONTAINER_IMAGE_BASE }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        working-directory: infra/envs/prod
