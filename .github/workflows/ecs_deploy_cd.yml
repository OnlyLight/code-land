name: ECS Deploy Backend

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "sources/backend/**"

permissions:
  contents: read
  id-token: write

env:
  ECS_CLUSTER: codeland-cluster
  ECS_SERVICE: codeland-service

jobs:
  build:
    runs-on: ubuntu-latest
    environment: prod

    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }} # ap-southeast-1

      - name: Login to Amazon ECR Public
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public
          mask-password: "true"

      - name: Build & Push Image
        run: |
          IMAGE_TAG=${{ github.sha }}

          docker build -t ${{ vars.ECR_REGISTRY }}:$IMAGE_TAG ./sources/backend

          docker tag ${{ vars.ECR_REGISTRY }}:$IMAGE_TAG \
            ${{ vars.ECR_REGISTRY }}:latest

          docker push ${{ vars.ECR_REGISTRY }}:$IMAGE_TAG
          docker push ${{ vars.ECR_REGISTRY }}:latest

          echo "image=${{ vars.ECR_REGISTRY }}:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    environment: prod
    needs: build

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update ECS service to new image
        run: |
          IMAGE="${{ needs.build.outputs.image }}"

          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --force-new-deployment \
            --region "${{ vars.AWS_REGION }}" \
            --image "$IMAGE" \
            --output json
