name: ECS Deploy Backend

on:
  push:
    branches: ["main"]
    paths:
      - "sources/backend/**"

permissions:
  id-token: write
  contents: read

env:
  ECR_REPO: codeland-backend
  ECS_CLUSTER: codeland-cluster
  ECS_SERVICE: backend-service
  TASK_FAMILY: backend-task

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Login ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Image
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t $ECR_REPO:$IMAGE_TAG ./backend
          docker tag $ECR_REPO:$IMAGE_TAG \
            ${{ steps.login-ecr.outputs.registry }}/$ECR_REPO:$IMAGE_TAG
          docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPO:$IMAGE_TAG

